name: nodejs eks feature

on:
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string

      component:
        description: 'Component name'
        required: true
        type: string

env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}

jobs:
  build-nodejs:
    runs-on:
      group: roboshop
      labels: nodejs

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List files
        run: ls -l

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Print version
        run: echo "The version is ${{ steps.version.outputs.version }}"

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test