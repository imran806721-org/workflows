name : nodejs eks feature
on: 
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string

env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
jobs: 
  build-nodejs:
    #  runs-on: ubuntu-latest
    runs-on: 
      group: roboshop
      labels: nodejs
    steps:
     - name: checkout code
       uses: actions/checkout@v7  # these are like jenkins plugins
       
     - name: list files
       run:
        ls -l
     - name: read version
       id: version
       run: |
        VERSION=$(jq -r '.version' package.json)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

     - name: print version
       run: echo "The version is ${{ steps.version.outputs.version }}"
       
     - name: install dependencies
       run: npm install

     - name: unit tests
       run: npm test
       