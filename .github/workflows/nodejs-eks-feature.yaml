name : nodejs eks feature
on: 
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string

environment:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
jobs: 
  build-nodejs:
     runs-on: ubuntu-latest
     steps:
     - name: checkout code
       uses: actions/checkout@v7  # these are like jenkins plugins
       
     - name: list files
       run:
        ls -l
     - name: read version
       id: version
       run:
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      -name: print version
       ruhn: echo "The version is ${{ steps.package-version.outputs.version }}"